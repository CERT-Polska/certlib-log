name: "Release new certlib.log version"

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  call-test-workflow:
    uses: ./.github/workflows/test.yml

  call-various-checks-workflow:
    uses: ./.github/workflows/various_checks.yml

  build-and-publish:
    needs:
    - call-test-workflow
    - call-various-checks-workflow
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.x'

    - name: Install build tool
      run: |
        ./check-and-upgrade-pip-to-v26-2-2.bash --no-require-virtualenv \
        && python3 -m pip install --upgrade build

    - name: Build
      run: |
        python3 -m build

    - name: Publish to PyPi
      uses: pypa/gh-action-pypi-publish@v1.14.3
      with:
        user: __token__
        password: ${{ secrets.pypi_password }}
        print-hash: true
        verbose: true
