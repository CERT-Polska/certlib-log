name: "Various checks related to certlib.log"

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dev-install-and-type-checks:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
        - "3.10"
        - "3.11"
        - "3.12"
        - "3.13"
        - "3.14"
        - "3.15"

    steps:
    - uses: actions/checkout@v7

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}
        allow-prereleases: true
        cache: 'pip'
        cache-dependency-path: dev/dev-requirements.txt

    - name: Install "for development", with "dev" dependencies
      run: |
        ./dev-install.bash

    - name: Type check the library with mypy
      run: |
        ./dev/venv/bin/python3 -m mypy -p certlib.log

    - name: Type check the tests with mypy
      run: |
        ./dev/venv/bin/python3 -m mypy ./tests/test_certlib_log.py

  docs-building-check:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        # (3.14 is currently used in `.readthedocs.yaml`)
        python-version: '3.14'
        cache: 'pip'
        cache-dependency-path: docs/doc-requirements.txt

    - name: Install doc dependencies
      run: |
        ./check-and-upgrade-pip-to-v26-2-2.bash --no-require-virtualenv \
        && python3 -m pip install --require-hashes --no-input -r docs/doc-requirements.txt

    - name: Build docs
      run: |
        mkdocs build --config-file docs/mkdocs.yml --strict
