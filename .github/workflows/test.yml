# This workflow is based on the "Python package" one. It will install test dependencies and run tests.
# See also: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python.

name: "Run certlib.log's tests"

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prepare-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
        - "3.10"
        - "3.11"
        - "3.12"
        - "3.13"
        - "3.14"
        - "3.15"
        - "pypy3.10"
        - "pypy3.11"
        - "pypy3.12"
    steps:
    - uses: actions/checkout@v6

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}
        allow-prereleases: true
        cache: 'pip'
        cache-dependency-path: tests/test-requirements.txt

    - name: Install test dependencies
      run: |
        python3 -m pip install --upgrade pip
        python3 -m pip install --use-pep517 -r tests/test-requirements.txt

    - name: Test with pytest
      run: |
        pytest

  prepare-and-test-unofficial-py39:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6

    - name: Set up Python 3.9
      uses: actions/setup-python@v6
      with:
        python-version: '3.9'

    - name: Install pytest
      run: |
        python3 -m pip install --upgrade pip
        python3 -m pip install --use-pep517 'pytest>=8.0'

    - name: Test with pytest
      run: |
        pytest -ra --doctest-modules src/certlib tests
